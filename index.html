<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日のランチルーレット</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background: linear-gradient(#bfe6ff 0%, #fff4dc 75%);
      background-attachment: fixed;
      min-height: 100vh;
      box-sizing: border-box;
      margin: 0;
      padding: 24px 16px;
    }
    .bg {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 52vh;
      z-index: -1;
      pointer-events: none;
    }
    .bg svg { width: 100%; height: 100%; display: block; }
    .kuina {
      position: fixed;
      top: 54vh;
      left: 0;
      width: 84px;
      z-index: 0;
      pointer-events: none;
      transform: translateX(-120px);
      animation: fly 14s linear 1s infinite;
    }
    .kuina-bob { animation: bob 0.9s ease-in-out infinite; }
    .kuina svg { width: 100%; display: block; }
    .wing {
      transform-box: fill-box;
      transform-origin: 85% 90%;
      animation: flap 0.28s ease-in-out infinite alternate;
    }
    @keyframes fly {
      0% { transform: translateX(-120px); }
      65%, 100% { transform: translateX(calc(100vw + 40px)); }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50% { transform: translateY(-14px) rotate(4deg); }
    }
    @keyframes flap {
      from { transform: rotate(-28deg); }
      to { transform: rotate(22deg); }
    }
    h1 {
      font-size: 24px;
    }
    .wheel-area {
      position: relative;
      width: 300px;
      height: 300px;
      margin: 24px auto;
    }
    .pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 28px solid #333;
      z-index: 1;
    }
    .shisa {
      position: absolute;
      bottom: -18px;
      width: 84px;
      height: 100px;
      z-index: 2;
    }
    .shisa.left {
      left: -30px;
      --body: #ecd3a4;
      --mane: #d49a6a;
    }
    .shisa.right {
      right: -30px;
      transform: scaleX(-1);
      --body: #cfdcc0;
      --mane: #9fb98a;
      animation-delay: -1.7s;
    }
    .shisa { animation: bounce 3.5s ease-in-out infinite; }
    @keyframes bounce {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 -5px; }
    }
    .title-hib {
      width: 30px;
      height: 30px;
      vertical-align: middle;
      margin: 0 4px;
    }
    .food svg {
      width: 150px;
      height: 125px;
      animation: pop 0.5s ease-out;
    }
    @keyframes pop {
      0% { transform: scale(0.3); opacity: 0; }
      70% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); }
    }
    #wheel {
      width: 300px;
      height: 300px;
      transition: transform 3s ease-out;
    }
    button {
      font-size: 18px;
      padding: 10px 32px;
      cursor: pointer;
    }
    button.sub {
      font-size: 14px;
      padding: 6px 14px;
      margin-left: 8px;
    }
    #result:not(:empty) {
      background: rgba(255, 255, 255, 0.75);
      border-radius: 18px;
    }
    #result {
      position: relative;
      z-index: 1;
      max-width: 280px;
      margin-left: auto;
      margin-right: auto;
      font-size: 22px;
      margin-top: 20px;
      min-height: 190px;
    }
  </style>
</head>

    let rotation = 0;

    // ルーレットを描く
    function drawWheel() {
      const size = 360 / items.length;
      for (let i = 0; i < items.length; i++) {
        const start = (i * size - 90) * Math.PI / 180;
        const end = ((i + 1) * size - 90) * Math.PI / 180;

        ctx.beginPath();
        ctx.moveTo(150, 150);
        ctx.arc(150, 150, 150, start, end);
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();

        ctx.save();
        ctx.translate(150, 150);
        ctx.rotate((start + end) / 2);
        ctx.fillStyle = "#333";
        ctx.font = "14px sans-serif";
        ctx.textAlign = "right";
        ctx.fillText(items[i], 142, 5);
        ctx.restore();
      }
    }


    // ---- 沖縄っぽい音楽(外部ファイルなし。ブラウザの音声機能で三線風の音を作る) ----
    // 琉球音階: ド ミ ファ ソ シ ド
    const scale = [261.6, 329.6, 349.2, 392.0, 493.9, 523.3, 659.3];
    let audioCtx = null;
    let soundOn = true;
    const pluckCache = {};

    // 弦をはじいたような音の波形を作る
    function makePluck(freq) {
      if (pluckCache[freq]) return pluckCache[freq];
      const rate = audioCtx.sampleRate;
      const length = Math.floor(rate * 1.3);
      const buffer = audioCtx.createBuffer(1, length, rate);
      const data = buffer.getChannelData(0);
      const period = Math.round(rate / freq);
      for (let i = 0; i < period; i++) data[i] = Math.random() * 2 - 1;
      for (let i = period; i < length; i++) {
        data[i] = (data[i - period] + data[i - period + 1]) * 0.4985;
      }
      pluckCache[freq] = buffer;
      return buffer;
    }

    function playNote(freq, when, volume) {
      const source = audioCtx.createBufferSource();
      source.buffer = makePluck(freq);
      const gain = audioCtx.createGain();
      gain.gain.value = volume;
      source.connect(gain);
      gain.connect(audioCtx.destination);
      source.start(audioCtx.currentTime + when);
    }

    // 回している間のメロディ(だんだんゆっくりになる)
    function playSpinMusic() {
      if (!soundOn) return;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      const phrase = [0, 1, 2, 3, 4, 5, 4, 3, 2, 3, 1, 2, 0, 1];
      const count = phrase.length;
      for (let k = 0; k < count; k++) {
        const when = 2.7 * (1 - Math.pow(1 - k / count, 0.6));
        playNote(scale[phrase[k]], when, 0.7);
      }
    }

    // 止まったときのしめの音
    function playStopSound() {
      if (!soundOn || !audioCtx) return;
      [0, 3, 5].forEach(function (n, i) {
        playNote(scale[n], i * 0.06, 0.8);
      });
    }

    const soundButton = document.getElementById("sound");
    soundButton.addEventListener("click", function () {
      soundOn = !soundOn;
      soundButton.textContent = "♪ 音: " + (soundOn ? "ON" : "OFF");
      soundButton.setAttribute("aria-pressed", soundOn);
    });

    // 結果とイラストを出す
    function showResult(index) {
      resultText.innerHTML = '<div class="food">' + foodImages[index] + '</div><div>結果：' + items[index] + '</div>';
    }

    // 回すボタンを押したとき
    spinButton.addEventListener("click", function () {
      spinButton.disabled = true;
      resultText.textContent = "";

      playSpinMusic();
      rotation += 1800 + Math.random() * 360;
      canvas.style.transform = "rotate(" + rotation + "deg)";

      setTimeout(function () {
        const size = 360 / items.length;
        const angle = (360 - (rotation % 360)) % 360;
        const index = Math.floor(angle / size);
        showResult(index);
        playStopSound();
        spinButton.disabled = false;
      }, 3000);
    });

    drawWheel();
  </script>
